name: Dart
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GAME_BINARY: ${{ runner.os == 'Windows' && 'build/roguelike.exe' || 'build/roguelike' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib bin example test
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run example/seeded_world.dart
      - run: mkdir -p build
      - run: dart compile exe bin/main.dart -o "$GAME_BINARY"
      - run: printf 'q\n' | "$GAME_BINARY" --seed 42
